name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          # Always use the newest 24.x, not the runner's cached (possibly unpatched) Node.
          check-latest: true
          cache: npm
      # Install scripts of dependencies never run; none of them need one.
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      - name: dist is up to date
        run: |
          npm run build
          git diff --exit-code dist/ || (echo "::error::dist/ is stale; run npm run build and commit" && exit 1)
      - name: the installed package runs
        run: |
          npm pack
          npm install -g ./ota-eita-lockfile-guard-*.tgz
          lockfile-guard --version | grep -q '^lockfile-guard '
          lockfile-guard --offline --fail-on none test/fixtures/risky | grep -q 'LG002'
          rm ota-eita-lockfile-guard-*.tgz

  guard-self:
    # lockfile-guard checks this repository's own lockfile with the committed action,
    # including the 7-day cooldown against the live npm registry.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./
        id: guard
        with:
          fail-on: medium
          # Reviewed: esbuild only verifies its platform binary, fsevents builds a macOS addon.
          # CI installs with --ignore-scripts anyway.
          allow-scripts: esbuild,fsevents
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: ${{ steps.guard.outputs.sarif-file }}
          category: lockfile-guard

  risky-fixture:
    # The action must detect the deliberately risky fixture and fail the step.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./
        id: guard
        continue-on-error: true
        with:
          path: test/fixtures/risky
          offline: "true"
      - name: findings were reported and the step failed
        env:
          OUTCOME: ${{ steps.guard.outcome }}
          FINDINGS: ${{ steps.guard.outputs.findings }}
        run: |
          test "$OUTCOME" = failure
          test "$FINDINGS" -ge 8

  gha-guard:
    # Audits this repository's workflows with https://github.com/OTA-EITA/gha-guard.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: OTA-EITA/gha-guard@647404df7b2c96877a2043a92e09382a1ee1dde9 # v0.1.2
        id: guard
        with:
          fail-on: low
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: ${{ steps.guard.outputs.sarif-file }}
          category: gha-guard
