name: lockfile-guard
description: Catch supply-chain risks in package-lock.json before npm install runs them
author: OTA-EITA
branding:
  icon: lock
  color: green

inputs:
  path:
    description: Space separated lockfiles or directories to scan
    default: .
  fail-on:
    description: Fail on findings at least this severe (high, medium, low or none)
    default: high
  min-age:
    description: Report versions published fewer than this many days ago
    default: "7"
  allow-scripts:
    description: Packages allowed to run install scripts, comma or space separated
    default: ""
  offline:
    description: Skip the checks that query the registry (freshly published, deprecated)
    default: "false"
  sarif-file:
    description: Where to write the SARIF report
    default: lockfile-guard.sarif

outputs:
  sarif-file:
    description: Path of the SARIF report, for github/codeql-action/upload-sarif
  findings:
    description: Number of findings

runs:
  using: node24
  main: dist/action.js
